<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>论文大纲生成</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* 覆盖默认 body，全屏展示 */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
    }

    /* 主容器 */
    .outline-app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }

    /* ===== 阶段 1：欢迎输入页 ===== */
    .stage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
    }
    .stage.active {
      display: flex;
    }

    /* ===== 阶段 1：欢迎输入页 — 顶栏 + 侧边栏 + 主操作区 ===== */
    /* 欢迎页自成布局：撑满、不居中、内部各区独立滚动 */
    #stage-welcome {
      padding: 0;
      align-items: stretch;
      justify-content: flex-start;
      overflow: hidden;
    }

    /* ── 顶部导航栏：弱化品牌，强化工具属性 ── */
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      background: var(--ink);
      color: #fff;
    }
    .topbar-brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .topbar-name { font-size: 14px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
    .topbar-tag {
      font-size: 12px;
      color: rgba(255,255,255,.55);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-nav { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .topbar-nav a {
      font-size: 12px;
      color: rgba(255,255,255,.7);
      text-decoration: none;
      transition: color .15s;
    }
    .topbar-nav a:hover { color: #fff; }
    .topbar-nav .sep { color: rgba(255,255,255,.25); font-size: 12px; }

    /* ── 主体：左历史 + 右表单 ── */
    .welcome-body { flex: 1; display: flex; min-height: 0; }

    /* ── 左侧历史记录栏 ── */
    .history-sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #f1f0ee;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .history-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 10px;
      border-bottom: 1px solid var(--line);
    }
    .history-head h3 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: .04em;
    }
    .history-toggle {
      border: none;
      background: none;
      font-family: inherit;
      font-size: 12px;
      color: var(--ink-soft);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background .15s, color .15s;
    }
    .history-toggle:hover { background: var(--mist-deep); color: var(--ink); }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .history-sidebar.collapsed .history-list { display: none; }

    .history-item {
      display: block;
      padding: 8px 10px;
      border-radius: 6px;
      text-decoration: none;
      color: var(--ink);
      transition: background .15s;
    }
    .history-item:hover { background: rgba(43,45,48,.055); }
    .history-topic {
      display: block;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-line { display: flex; align-items: center; gap: 6px; }
    .history-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 4px;
      color: #3d6b8f;
      background: rgba(61,107,143,.1);
    }
    .history-badge.full { color: #3f7d5c; background: rgba(63,125,92,.12); }
    .history-count {
      flex-shrink: 0;
      font-size: 10px;
      color: var(--ink-soft);
      background: var(--mist-deep);
      padding: 3px 5px;
      border-radius: 4px;
      line-height: 1;
    }
    .history-time { margin-left: auto; flex-shrink: 0; font-size: 11px; color: #8b8d93; }
    .history-empty { padding: 14px 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; }

    /* ── 右侧主操作区 ── */
    .welcome-main { flex: 1; overflow-y: auto; min-width: 0; }
    .welcome-box {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 44px 32px 64px;
      text-align: left;
    }

    .page-title {
      font-family: "Noto Serif SC", serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .page-sub {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.7;
      margin: 0 0 36px;
    }

    /* 卡片式分组：无外框，靠间距与字重分层 */
    .field { margin-bottom: 28px; }
    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .field-label .opt { font-weight: 400; font-size: 12px; color: var(--ink-soft); margin-left: 6px; }
    .field-hint { font-size: 12px; color: #8b8d93; line-height: 1.6; margin-top: 6px; }

    /* 输入框：极细边框 + 聚焦主色轻外发光 */
    .input-field,
    .input-area {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 13px;
      border: 1px solid #e0ded8;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      background: #fff;
      color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
    }
    .input-field::placeholder,
    .input-area::placeholder { color: #a9abb0; }
    .input-field:focus,
    .input-area:focus {
      outline: none;
      border-color: #8B2635;
      box-shadow: 0 0 0 3px rgba(139,38,53,.09);
    }
    .input-area {
      min-height: 150px;
      resize: vertical;
      line-height: 1.65;
    }

    /* 上传：轻量次要按钮，贴在描述框上方 */
    .upload-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      background: transparent;
      color: var(--ink-soft);
      border: 1px solid #e0ded8;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
      flex-shrink: 0;
    }
    .upload-btn:hover { border-color: #8B2635; color: #8B2635; background: rgba(139,38,53,.04); }
    .upload-btn.uploading { opacity: .6; pointer-events: none; }

    .upload-status {
      font-size: 12px;
      color: var(--ink-soft);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .upload-status.ok { color: #3f7d5c; }
    .upload-status.err { color: #8B2635; }

    /* 提交按钮：中等宽度居中，低饱和深酒红 */
    .submit-row { display: flex; justify-content: center; margin-top: 36px; }
    .btn-primary {
      min-width: 200px;
      padding: 12px 32px;
      background: #8B2635;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
    }
    .btn-primary:hover { background: #75202c; box-shadow: 0 2px 8px rgba(139,38,53,.25); }
    .btn-primary:active { background: #661b26; box-shadow: none; }
    .btn-primary:disabled {
      background: var(--mist-deep);
      color: var(--ink-soft);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ===== 阶段 2：加载动画 ===== */
    .loading-box {
      text-align: center;
    }

    #genlogMount {
      width: min(560px, 90vw);
      margin: 0 auto;
    }

    /* ===== 阶段 3：大纲展示（垂直时间线） ===== */
    .outline-view {
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    /* 左侧：章节列表 */
    .sections-sidebar {
      width: 320px;
      flex-shrink: 0;
      background: var(--mist);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      padding: 20px 16px;
    }

    .sections-title {
      font-family: "Noto Serif SC", serif;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--ink);
    }

    .section-item {
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .section-item:hover {
      background: var(--mist-deep);
    }
    .section-item.active {
      background: var(--paper);
      border-color: var(--rouge);
      box-shadow: 0 2px 8px var(--shadow);
    }

    .section-num {
      display: inline-block;
      width: 24px;
      height: 24px;
      background: var(--gold);
      color: #fff;
      border-radius: 50%;
      text-align: center;
      line-height: 24px;
      font-size: 13px;
      font-weight: 600;
      margin-right: 10px;
    }
    .section-item.active .section-num {
      background: var(--rouge);
    }

    .section-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
    }

    .section-badge {
      float: right;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--rouge);
      background: rgba(178, 61, 61, 0.08);
      border: 1px solid rgba(178, 61, 61, 0.25);
      padding: 2px 7px;
      border-radius: 10px;
    }

    .focus-data-note {
      margin-bottom: 24px;
      padding: 14px 18px;
      background: rgba(178, 61, 61, 0.05);
      border: 1px solid rgba(178, 61, 61, 0.2);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--ink);
    }
    .focus-data-note strong {
      display: block;
      margin-bottom: 4px;
      color: var(--rouge);
      font-size: 14px;
    }

    /* 右侧：焦点详情 */
    .section-focus {
      flex: 1;
      overflow-y: auto;
      padding: 40px 60px;
    }

    .focus-header {
      margin-bottom: 32px;
    }

    .focus-title {
      font-family: "Noto Serif SC", serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .focus-meta {
      font-size: 13px;
      color: var(--ink-soft);
    }

    /* 正文改白底：只有重点结论/公式/验证块才上底色，避免整段灰底压抑 */
    .focus-summary {
      font-size: 15px;
      line-height: 1.85;
      color: var(--ink);
      margin-bottom: 28px;
    }

    /* ── 逻辑块：小标题 + 细分割线，块与块之间留白 ── */
    .sum-block { padding: 0 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .sum-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .sum-block-label {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 600;
    }
    .sum-block-label .lbl-zh { color: var(--rouge); letter-spacing: .02em; }
    .sum-block-label .lbl-en {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-soft);
      opacity: .75;
      font-family: "Noto Serif SC", serif;
    }
    .sum-block-label .lbl-zh:empty, .sum-block-label .lbl-en:empty { display: none; }

    /* 英文正文与中文译文：译文弱化，用左侧细线区分 */
    .sum-en > *:first-child, .sum-zh > *:first-child { margin-top: 0; }
    .sum-en > *:last-child, .sum-zh > *:last-child { margin-bottom: 0; }
    .sum-en p { margin: 0 0 10px; }
    .sum-zh {
      margin-top: 12px;
      padding-left: 12px;
      border-left: 2px solid var(--mist);
      font-size: 14px;
      line-height: 1.8;
      color: var(--ink-soft);
    }
    .sum-zh p { margin: 0 0 8px; }

    /* 关键结论/排名/数值：加粗处用主题色强调 */
    .sum-en strong, .sum-zh strong {
      color: var(--rouge);
      font-weight: 600;
      background: rgba(192, 72, 81, 0.06);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* 验证计算 / 案例：卡片化，与主论述分离 */
    .sum-en blockquote, .sum-zh blockquote {
      margin: 12px 0;
      padding: 12px 16px;
      background: #fcfbf7;
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold);
      border-radius: 6px;
      font-size: 14px;
      color: var(--ink-soft);
    }
    .sum-en blockquote p, .sum-zh blockquote p { margin: 0 0 6px; }
    .sum-en blockquote p:last-child, .sum-zh blockquote p:last-child { margin-bottom: 0; }

    .sum-en ul, .sum-en ol, .sum-zh ul, .sum-zh ol { margin: 0 0 10px; padding-left: 22px; }
    .sum-en li, .sum-zh li { margin-bottom: 4px; }
    .sum-en table, .sum-zh table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
    .sum-en th, .sum-en td, .sum-zh th, .sum-zh td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
    .sum-en th, .sum-zh th { background: #faf9f6; font-weight: 600; }

    /* 行内公式与自然语言拉开视觉差 */
    .sum-en .katex, .sum-zh .katex { font-size: 1.02em; }
    .sum-en :not(.katex-display) > .katex, .sum-zh :not(.katex-display) > .katex {
      background: rgba(43, 45, 48, 0.035);
      padding: 0 3px;
      border-radius: 3px;
    }

    /* 语言切换 */
    .focus-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .lang-toggle { display: flex; flex-shrink: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .lang-toggle button {
      padding: 5px 12px;
      font-size: 12px;
      font-family: inherit;
      border: none;
      background: var(--paper);
      color: var(--ink-soft);
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .lang-toggle button + button { border-left: 1px solid var(--line); }
    .lang-toggle button:hover { background: #f3f1ec; }
    .lang-toggle button.active { background: var(--rouge); color: #fff; }
    .focus-summary.lang-en .sum-zh, .focus-summary.lang-en .lbl-zh { display: none; }
    .focus-summary.lang-zh .sum-en, .focus-summary.lang-zh .lbl-en { display: none; }
    .focus-summary.lang-zh .sum-zh {
      margin-top: 0; padding-left: 0; border-left: none;
      font-size: 15px; color: var(--ink);
    }

    .focus-formulas {
      margin-bottom: 28px;
    }

    .formulas-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 12px;
    }

    /* 公式：居中独立陈列 + 右侧编号 + 变量表紧跟其下 */
    .formula-item {
      position: relative;
      margin: 0 0 12px;
      padding: 18px 44px 14px 20px;
      background: #fbfbfa;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .formula-body { text-align: center; overflow-x: auto; overflow-y: hidden; }
    .formula-body .katex-display { margin: 0; }
    .formula-no {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--ink-soft);
      opacity: .8;
    }
    .formula-where {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      margin: 14px 0 0;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      font-size: 13px;
    }
    .formula-where dt { text-align: right; color: var(--ink); }
    .formula-where dd { margin: 0; color: var(--ink-soft); }
    .formula-where-title { font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }

    .focus-citations {
      margin-bottom: 32px;
    }

    .citation-item {
      padding: 12px 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    .citation-title {
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .citation-meta {
      color: var(--ink-soft);
    }

    /* ── 章节操作区：微调 + 重写 + 版本回溯 ── */
    .focus-actions-wrap { position: relative; margin-top: 28px; }
    .focus-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      align-items: flex-end;
    }

    /* 次要按钮：描边（微调，轻量操作） */
    .btn-secondary {
      padding: 11px 20px;
      background: var(--paper);
      color: var(--ink-soft);
      border: 1px solid #d8d6d0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-secondary:hover { border-color: #8B2635; color: #8B2635; }

    /* 主按钮：实心（重写，整体操作） */
    .btn-primary-sm {
      padding: 11px 20px;
      background: #8B2635;
      color: #fff;
      border: 1px solid #8B2635;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .btn-primary-sm:hover { background: #75202c; box-shadow: 0 2px 8px rgba(139,38,53,.25); }
    .btn-primary-sm:disabled,
    .btn-secondary:disabled,
    .btn-mini:disabled { opacity: .55; cursor: not-allowed; }

    .btn-mini {
      padding: 7px 14px;
      background: var(--paper);
      color: var(--ink-soft);
      border: 1px solid #d8d6d0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-mini:hover { border-color: #8B2635; color: #8B2635; }
    .btn-mini.primary { background: #8B2635; border-color: #8B2635; color: #fff; }
    .btn-mini.primary:hover { background: #75202c; }

    /* 整章级微调面板：平滑展开 */
    .refine-panel {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
      margin-bottom: 0;
      background: #fbfaf7;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .refine-panel.open { max-height: 440px; opacity: 1; margin-bottom: 14px; }
    .refine-panel-inner { padding: 16px; }
    .refine-guide { font-size: 13px; font-weight: 600; color: var(--ink); margin: 0 0 12px; }

    .quick-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .quick-tag {
      padding: 5px 12px;
      font-size: 12px;
      color: var(--ink-soft);
      background: #fff;
      border: 1px solid #e0ded8;
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .quick-tag:hover { border-color: #8B2635; color: #8B2635; background: rgba(139,38,53,.04); }

    .refine-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #e0ded8;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      background: #fff;
      color: var(--ink);
      resize: vertical;
      min-height: 70px;
      line-height: 1.6;
    }
    .refine-input:focus {
      outline: none;
      border-color: #8B2635;
      box-shadow: 0 0 0 3px rgba(139,38,53,.09);
    }

    /* 板块编辑按钮：悬停显现 */
    .block-edit {
      margin-left: auto;
      flex-shrink: 0;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;

  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="/static/render.js"></script>
  <script src="/static/progress-log.js"></script>
  <script>
    let outlineData = null;
    let currentSectionIndex = 0;
    let isGenerating = false;

    // 生成进行中刷新/关闭时提示，避免误打断（后端断点续传兜底）
    window.addEventListener('beforeunload', (e) => {
      if (isGenerating) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // 切换阶段
    function showStage(stageName) {
      document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
      document.getElementById(`stage-${stageName}`).classList.add('active');
    }

    // 文件上传：点击按钮触发文件选择
    const btnUpload = document.getElementById('btnUpload');
    const fileInput = document.getElementById('fileInput');
    const uploadStatus = document.getElementById('uploadStatus');
    const problemDescription = document.getElementById('problemDescription');
    const problemThought = document.getElementById('problemThought');
    const problemTitle = document.getElementById('problemTitle');

    btnUpload.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      btnUpload.classList.add('uploading');
      uploadStatus.textContent = `正在上传并解析「${file.name}」...`;
      uploadStatus.className = 'upload-status';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const resp = await fetch('/api/paper/upload-problem', {
          method: 'POST',
          body: formData,
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: '上传失败' }));
          throw new Error(err.detail || '上传失败');
        }

        const result = await resp.json();
        uploadStatus.textContent = `✓ 已解析「${result.filename}」（${result.content.length} 字符）`;
        uploadStatus.className = 'upload-status ok';

        // 若标题为空，用文件名填充标题
        if (!problemTitle.value.trim()) {
          const base = result.filename.replace(/\.[^.]+$/, '');
          problemTitle.value = base;
        }

        // 将提取内容填入「题目描述」框（覆盖，因为题目文件应完整替换题目描述）
        problemDescription.value = result.content;
      } catch (error) {
        uploadStatus.textContent = `✗ ${error.message}`;
        uploadStatus.className = 'upload-status err';
      } finally {
        btnUpload.classList.remove('uploading');
        fileInput.value = '';
      }
    });

    // 开始生成
    document.getElementById('btnStart').addEventListener('click', async () => {
      const title = document.getElementById('problemTitle').value.trim();
      const description = document.getElementById('problemDescription').value.trim();
      const thought = document.getElementById('problemThought').value.trim();
      const userData = document.getElementById('problemData').value.trim();

      if (!title || !description) {
        alert('请填写题目标题和题目描述（描述可上传文件获取）');
        return;
      }

      showStage('loading');

      try {
        await generateOutline(title, description, thought, userData);
      } catch (error) {
        alert('生成失败: ' + error.message);
        showStage('welcome');
      }
    });

    // 调用 API 生成大纲
    async function generateOutline(title, description, thought, userData) {
      isGenerating = true;
      const ctl = GenLog.mount(document.getElementById('genlogMount'), { total: 9, kind: 'outline' });
      try {
        const response = await fetch('/api/paper/outline', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            problem_title: title,
            problem_description: description,
            search_query: extractKeywords(title, description),
            user_thought: thought,
            user_data: userData
          })
        });

        if (!response.ok) throw new Error('请求失败');

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          // stream:true 避免多字节中文被分片截断成乱码
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          // 最后一行可能不完整（跨 chunk），留到下一次累积
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = JSON.parse(line.substring(6));

            if (data.type === 'progress') {
              ctl.push(data);
            } else if (data.type === 'session_created') {
              // 尽早把 session_id 写进 URL：刷新后据此断点续传
              history.replaceState(null, '', '/outline?session_id=' + encodeURIComponent(data.session_id));
            } else if (data.type === 'outline_ready') {
              ctl.finish(data);
              handleOutlineReady(data);
              return;
            } else if (data.type === 'error') {
              ctl.fail(data.message);
              throw new Error(data.message);
            }
          }
        }
      } finally {
        isGenerating = false;
      }
    }

    function handleOutlineReady(data) {
      outlineData = data;

      // 把 session_id 写进 URL，刷新（F5）后据此重载同一份大纲
      if (data && data.session_id) {
        history.replaceState(null, '', '/outline?session_id=' + encodeURIComponent(data.session_id));
      }

      // 显示大纲阶段
      showStage('outline');

      // 渲染章节列表
      renderSectionsList(data.sections);

      // 显示统计
      document.getElementById('statsText').textContent =
        `已搜索 ${data.literature_stats.papers} 篇文献，提取 ${data.literature_stats.chunks} 个知识片段`;

      // 默认选中第一个章节
      selectSection(0);
    }

    function renderSectionsList(sections) {
      const list = document.getElementById('sectionsList');
      list.innerHTML = sections.map((sec, i) => `
        <div class="section-item ${i === 0 ? 'active' : ''}" data-index="${i}">
          <span class="section-num">${i+1}</span>
          <span class="section-name">${sec.title}</span>
          ${sec.needs_user_data ? '<span class="section-badge">需数据</span>' : ''}
        </div>
      `).join('');

      // 绑定点击事件
      list.querySelectorAll('.section-item').forEach(item => {
        item.addEventListener('click', () => {
          const index = parseInt(item.dataset.index);
          selectSection(index);
        });
      });
    }

    // 英文块名 → 中文标签。中文标签只存在于预览，不进正文、不进 Word。
    const BLOCK_LABELS_ZH = {
      'Core Question': '核心问题', 'Key Constraints': '关键约束', 'Objectives': '研究目标',
      'Assumptions': '模型假设', 'Justification': '假设依据', 'Limitations': '模型局限',
      'Symbol Table': '符号表', 'Parameter Values': '参数取值',
      'Modeling Idea': '建模思路', 'Key Equations': '核心方程', 'Model Structure': '模型结构',
      'Solution Method': '求解方法', 'Key Results': '关键结果', 'Verification': '验证计算',
      'Data Source': '数据来源', 'Main Findings': '主要发现', 'Interpretation': '结果解读',
      'Method': '分析方法', 'Findings': '分析发现', 'Robustness': '稳健性',
      'Key Conclusion': '核心结论', 'Strengths': '模型优势',
      'Suggested Improvements': '改进建议',
      'Extensions': '推广方向', 'Conclusion': '总结', 'Summary': '概述',
    };

    let langMode = 'both';   // both | en | zh

    // 按 `### ` 把 Markdown 切成逻辑块
    function splitBlocks(md) {
      if (!md || !md.trim()) return [];
      const parts = md.split(/^###\s+/m);
      const out = [];
      if (parts[0] && parts[0].trim()) out.push({ heading: '', body: parts[0].trim() });
      for (let i = 1; i < parts.length; i++) {
        const seg = parts[i];
        const nl = seg.indexOf('\n');
        if (nl === -1) out.push({ heading: seg.trim(), body: '' });
        else out.push({ heading: seg.slice(0, nl).trim(), body: seg.slice(nl + 1).trim() });
      }
      return out;
    }

    function applyLangMode() {
      const wrap = document.getElementById('focusSummary');
      wrap.classList.remove('lang-both', 'lang-en', 'lang-zh');
      wrap.classList.add('lang-' + langMode);
      document.querySelectorAll('#langToggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === langMode);
      });
    }

    // 英文块 + 中文译文按序配对渲染（Markdown + KaTeX 走共享的 MMRender）
    function renderSummary(section) {
      const wrap = document.getElementById('focusSummary');
      const en = splitBlocks(section.summary);
      const zh = splitBlocks(section.summary_zh);
      if (!en.length && !zh.length) {
        wrap.style.display = 'none';
        document.getElementById('langToggle').style.display = 'none';
        return;
      }

      wrap.innerHTML = '';
      const n = Math.max(en.length, zh.length);
      for (let i = 0; i < n; i++) {
        const e = en[i] || { heading: '', body: '' };
        const z = zh[i] || { heading: '', body: '' };
        const block = document.createElement('section');
        block.className = 'sum-block';

        // 固定字典优先，保证同一块在各章、各次生成里标签一致；LLM 译名作兜底
        const zhLabel = BLOCK_LABELS_ZH[e.heading] || z.heading || '';
        if (zhLabel || e.heading) {
          const h = document.createElement('h4');
          h.className = 'sum-block-label';
          const sZh = document.createElement('span');
          sZh.className = 'lbl-zh';
          sZh.textContent = zhLabel;
          const sEn = document.createElement('span');
          sEn.className = 'lbl-en';
          sEn.textContent = e.heading;
          h.append(sZh, sEn);
          if (e.heading) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'block-edit';
            btn.title = '微调这个板块';
            btn.textContent = '✏️';
            btn.addEventListener('click', () => startBlockEdit(i, e.heading));
            h.appendChild(btn);
          }
          block.appendChild(h);
        }

        if (editingBlock && editingBlock.index === i) {
          block.appendChild(buildBlockEditor(i, e, z));
        } else {
          if (e.body) {
            const d = document.createElement('div');
            d.className = 'sum-en';
            MMRender.renderMarkdown(d, e.body);
            block.appendChild(d);
          }
          if (z.body) {
            const d = document.createElement('div');
            d.className = 'sum-zh';
            MMRender.renderMarkdown(d, z.body);
            block.appendChild(d);
          }
        }
        wrap.appendChild(block);
      }
      wrap.style.display = 'block';
      // 有中文译文时才给切换按钮
      document.getElementById('langToggle').style.display = zh.length ? 'flex' : 'none';
      applyLangMode();
    }

    // 公式：居中 + 自动编号 + 变量表紧跟其下
    function renderFormulas(section) {
      const box = document.getElementById('focusFormulas');
      const list = document.getElementById('formulasList');
      const fs = section.formulas || [];
      if (!fs.length) { box.style.display = 'none'; return; }

      list.innerHTML = fs.map((f, i) => {
        // 兼容旧后端：formulas 可能仍是字符串数组
        const latex = (typeof f === 'string' ? f : (f.latex || ''))
          .replace(/^\$\$([\s\S]*)\$\$$/, '$1').replace(/^\$([\s\S]*)\$$/, '$1').trim();
        const where = (f && typeof f === 'object' && Array.isArray(f.where)) ? f.where : [];
        const whereHtml = where.length ? `
          <div class="formula-where-title">其中：</div>
          <dl class="formula-where">
            ${where.map(w => `<dt data-tex="${MMRender.escapeHtml(w.sym || '')}"></dt>`
              + `<dd>${MMRender.escapeHtml(w.zh || '')}</dd>`).join('')}
          </dl>` : '';
        return `<figure class="formula-item">
            <div class="formula-body" data-tex="${MMRender.escapeHtml(latex)}"></div>
            <span class="formula-no">(${i + 1})</span>
            ${whereHtml}
          </figure>`;
      }).join('');

      // 裸 LaTeX 直接交给 katex.render（公式体 display，变量符号 inline）
      list.querySelectorAll('[data-tex]').forEach(el => {
        const tex = el.getAttribute('data-tex') || '';
        if (!tex) return;
        if (!window.katex) { el.textContent = tex; return; }
        try {
          katex.render(tex, el, {
            throwOnError: false,
            displayMode: el.classList.contains('formula-body'),
          });
        } catch (_) {
          el.textContent = tex;
        }
      });
      box.style.display = 'block';
    }

    document.getElementById('langToggle').addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-lang]');
      if (!btn) return;

    async function saveBlockEdit(editorEl) {
      const enText = editorEl.querySelector('.be-ta[data-lang="en"]').value.trim();
      const zhText = editorEl.querySelector('.be-ta[data-lang="zh"]').value.trim();

      const heading = editingBlock.heading;
      const section = currentSection();
      const enBlocks = splitBlocks(section.summary);
      const zhBlocks = splitBlocks(section.summary_zh);
      const idx = editingBlock.index;
      if (enBlocks[idx]) enBlocks[idx].body = enText;
      if (zhBlocks[idx]) zhBlocks[idx].body = zhText;
      try {
        const updated = await postSection('save', {
          summary: joinBlocks(enBlocks), summary_zh: joinBlocks(zhBlocks),
        });
        outlineData.sections[currentSectionIndex] = updated;
        editingBlock = null;
        renderSectionBody(updated);
        flashChanged();
        checkImpactAfterSave(heading, enText);
      } catch (e) {
        alert('保存失败：' + e.message);

    async function aiRewriteBlock(editorEl) {
      const instruction = editorEl.querySelector('.be-instruction').value.trim();

    async function regenerateAllOutline() {
      if (!outlineData || !outlineData.session_id) return;
      hideImpact();
      showStage('loading');
      const ctl = GenLog.mount(document.getElementById('genlogMount'), { total: 9, kind: 'outline' });
      isGenerating = true;
      try {
        const response = await fetch('/api/paper/outline/' + encodeURIComponent(outlineData.session_id) + '/regenerate-all', { method: 'POST' });
        if (!response.ok) throw new Error('请求失败');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = JSON.parse(line.substring(6));
            if (data.type === 'progress') {
              ctl.push(data);
            } else if (data.type === 'outline_ready') {
              ctl.finish(data);
              handleOutlineReady(data);
              return;
            } else if (data.type === 'error') {
              ctl.fail(data.message);
              throw new Error(data.message);
            }
          }
        }
      } catch (e) {
        alert('重新生成失败：' + e.message);
        showStage('outline');
      } finally {
        isGenerating = false;
      }
    }

        throw new Error(err.detail || '请求失败');
      }
      return resp.json();

    // 简单关键词提取
    function extractKeywords(title, description) {
      // 上传的题目文件可能是 JSON：解析出 title/tags/background，别把整段 JSON 当检索词发出去
      try {
        const obj = JSON.parse(description);
        if (obj && typeof obj === 'object') {
          const parts = [];
          if (obj.title) parts.push(String(obj.title));
          if (Array.isArray(obj.tags)) parts.push(...obj.tags.map(String));
          // background 是英文题面，比中文标题更适合 arXiv / Semantic Scholar 检索
          if (typeof obj.background === 'string') parts.push(obj.background.replace(/\s+/g, ' ').slice(0, 150));
          const q = parts.filter(Boolean).join(' ').trim();
          if (q) return q.slice(0, 200);
        }
      } catch (_) { /* 非 JSON，走下面 */ }
      return (title + ' ' + description).replace(/\s+/g, ' ').trim().slice(0, 200);
    }

    // ── 历史论文列表（同标题自动合并，只留最近一条 + 次数） ─────────────
    function renderHistory() {
      const wrap = document.getElementById('historyList');
      fetch('/api/paper/sessions')
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(data => {
          const list = data.sessions || [];
          if (!list.length) return;

          // 后端已按 updated_at 倒序：首次出现的即该标题最新的一条
          const merged = [];
          const seen = new Map();
          list.forEach(s => {
            const key = (s.topic || '').trim().replace(/^["']|["',]+$/g, '') || '未命名';
            if (seen.has(key)) { seen.get(key).count++; return; }
            const row = { ...s, cleanTopic: key, count: 1 };
            seen.set(key, row);
            merged.push(row);
          });

          wrap.innerHTML = merged.map(s => {
            const isFull = s.kind === 'full';
            const href = (isFull ? '/paper?session_id=' : '/outline?session_id=')
              + encodeURIComponent(s.session_id);
            const badge = isFull
              ? '<span class="history-badge full">完整论文</span>'
              : '<span class="history-badge">大纲</span>';
            const count = s.count > 1 ? `<span class="history-count">${s.count} 次</span>` : '';
            const time = (s.updated_at || '').slice(0, 10);
            return `<a class="history-item" href="${href}" title="${esc(s.cleanTopic)}">
              <span class="history-topic">${esc(s.cleanTopic)}</span>
              <span class="history-line">${badge}${count}<span class="history-time">${time}</span></span>
            </a>`;
          }).join('');
        })
        .catch(() => { /* 历史列表失败不阻塞主流程 */ });
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
      ));
    }

    document.getElementById('historyToggle').addEventListener('click', () => {
      const bar = document.getElementById('historySidebar');
      const collapsed = bar.classList.toggle('collapsed');
      document.getElementById('historyToggle').textContent = collapsed ? '+' : '−';
    });

    renderHistory();

    // ── 刷新/重开恢复：URL 带 session_id 时直接加载已生成的大纲 ──────────
    (function restoreOutline() {
      const sid = new URLSearchParams(window.location.search).get('session_id');
      if (!sid) return;
      fetch('/api/paper/outline/' + encodeURIComponent(sid))
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(data => {
          if (!data || !data.sections || !data.sections.length) return;
          const total = data.sections.length;
          const done = data.sections.filter(s => (s.summary || '').trim()).length;
          handleOutlineReady(data);
          // 部分生成（刷新/断网打断）：提示续传
          if (done > 0 && done < total) showResumeBanner(done, total);
        })
        .catch(() => { /* 会话已删除或数据不全，停留在欢迎页 */ });
    })();
  </script>
</body>
</html>
