<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/static/chat-tasks.js?v=1"></script>
  <script src="/static/waiting.js?v=companion1"></script>
  <link rel="stylesheet" href="/static/companion.css?v=1" />
  <script src="/static/companion-state.js?v=1"></script>
  <script src="/static/companion.js?v=1"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>建模研究台 · 做建模</title>
      <link rel="stylesheet" href="/static/style.css?v=research3" />
  <link rel="stylesheet" href="/static/anim.css?v=research3" />
  <link rel="stylesheet" href="/static/modeling-flow.css?v=research3" />
  <link rel="stylesheet" href="/static/ui.css?v=research3" />
  <script defer src="/static/ui.js?v=companion1"></script>
</head>
<body class="modeling-home">
  <div class="home">
    <canvas id="bg-canvas" class="mm-ambient"></canvas>
    <header class="home-top">
      <a class="home-back" href="/home">‹ 返回主页</a>
      <div class="home-brand"><span class="home-mark">◇</span>建模研究台</div>
      <div class="home-user" id="home-user"></div>
    </header>

    <main class="home-main"><div class="ui-title-row"><div><h1>工具</h1><p>为独立计算和探索留一张干净的工作台。</p></div></div><div class="ui-tools-grid"><article class="ui-tool"><h2>自由工作台</h2><p>管理文件、运行代码，随时与助教讨论。</p><a class="ui-btn primary" href="/build/free">打开工作台 →</a></article><article class="ui-tool"><h2>独立编辑器</h2><p>轻量的 Python 编辑与运行环境。</p><a class="ui-btn" href="/ide">打开编辑器 →</a></article></div></main>
  </div>

  <script src="/static/anim.js?v=research3"></script>
  <script src="/static/profile.js?v=research3"></script>
  <script>
    (function () {
      if (window.MMAnim) {
        MMAnim.ambientNetwork("#bg-canvas", { density: 26000, inkAlpha: 0.08, dotAlpha: 0.3, interactive: false });
        MMAnim.reveal(document.querySelector(".home-cards"), { observe: false });
      }
      Profile.require().then((p) => {
        if (!p) return;
        const user = document.getElementById("home-user");
        user.innerHTML = "";
        const badge = document.createElement("span");
        badge.className = "home-avatar";
        badge.textContent = Profile.avatarEmoji(p.avatar);
        const name = document.createElement("span");
        name.className = "home-name";
        name.textContent = p.nickname;
        const back = document.createElement("button");
        back.className = "home-logout";
        back.textContent = "主页";
        back.onclick = () => { location.href = "/home"; };
        user.append(badge, name, back);
      });
    })();
  </script>
</body>
</html>
