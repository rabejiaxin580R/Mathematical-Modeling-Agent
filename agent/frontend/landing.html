<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/static/chat-tasks.js?v=1"></script>
  <script src="/static/waiting.js?v=companion1"></script>
  <link rel="stylesheet" href="/static/companion.css?v=1" />
  <script src="/static/companion-state.js?v=1"></script>
  <script src="/static/companion.js?v=1"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>建模研究台 · 登录</title>
      <link rel="stylesheet" href="/static/style.css?v=research3" />
  <link rel="stylesheet" href="/static/anim.css?v=research3" />
  <link rel="stylesheet" href="/static/ui.css?v=research3" />
  <script defer src="/static/ui.js?v=companion1"></script>
</head>
<body>
  <canvas id="bg-canvas" class="bg-canvas"></canvas>
  <div class="landing">
    <div class="landing-card">
      <div class="landing-brand">
        <span class="landing-mark">◇</span>
        <div>
          <h1 class="landing-title">建模研究台</h1>
          <p class="landing-sub">为建模新手而生 · 即开即用</p>
        </div>
      </div>

      <p class="landing-hint">从问题、计算到论文，在一个地方推进你的研究。</p>

      <label class="landing-label">你的昵称</label>
      <input type="text" id="nickname" class="landing-input" maxlength="20" placeholder="例如：小明" autofocus />

      <details class="landing-optional"><summary>头像与分工偏好（可选）</summary><label class="landing-label">选个头像</label>
      <div class="avatar-grid" id="avatar-grid"></div>

      <label class="landing-label">你的分工（可选，之后可改）</label>
      <div class="role-grid" id="role-grid"></div>
      <p class="landing-hint role-hint">助教会据此、并结合你的能力评级调整回答侧重；不选则按评级自适应。</p>

      </details><button class="landing-btn" id="btn-enter">开始使用</button>

      <div class="landing-existing" id="existing" hidden></div>
    </div>
  </div>
  <script src="/static/anim.js?v=research3"></script>
  <script src="/static/profile.js?v=research3"></script>
<script src="/static/onboarding.js?v=policy3"></script>
  <script src="/static/landing.js?v=research3"></script>
</body>
</html>
