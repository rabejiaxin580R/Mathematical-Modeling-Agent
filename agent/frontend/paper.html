<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文生成</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .paper-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
            font-family: "Noto Serif SC", serif;
            font-weight: 700;
            font-size: 30px;
            color: var(--ink);
        }

        .step-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .step-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .step-number {
            width: 32px;
            height: 32px;
            background: var(--rouge);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 12px;
            font-family: "Noto Serif SC", serif;
            box-shadow: 0 2px 0 var(--rouge-deep);
        }

        .step-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--ink);
            font-family: "Noto Serif SC", serif;
        }

        .problem-select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: var(--ink);
            background: #fff;
            margin-bottom: 12px;
            transition: border-color 0.15s;
        }

        .problem-select:focus {
            outline: none;
            border-color: var(--rouge);
        }

        .problem-preview {
            background: var(--mist);
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-soft);
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .btn-primary {
            background: var(--rouge);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 2px 0 var(--rouge-deep);
            transition: all 0.15s;
        }

        .btn-primary:hover {
            background: var(--rouge-deep);
        }

        .btn-primary:disabled {
            background: var(--mist-deep);
            color: var(--ink-soft);
            box-shadow: none;
            cursor: not-allowed;
        }

        .status-box {
            background: var(--paper);
            border: 1px solid var(--line);
            padding: 14px 16px;
            margin-top: 16px;
            border-radius: 8px;
            display: none;
        }

        .result-box {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 20px var(--shadow);
            display: none;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 16px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--rouge);
        }

        .stat-label {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 4px;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--line);
            padding: 10px 20px;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-secondary:hover {
            border-color: var(--rouge);
            color: var(--rouge);
        }
    </style>
</head>
<body>
    <div class="paper-container">
        <h1 class="page-title">📚 论文生成系统</h1>

        <!-- Step 1: 选择题目 -->
        <div class="step-card">
            <div class="step-header">
                <div class="step-number">1</div>
                <div class="step-title">选择建模问题</div>
            </div>

            <select class="problem-select" id="problemSelect">
                <option value="">-- 请选择一个问题 --</option>
                <option value="2023A">2023 Problem A: 应急救护车选址优化</option>
                <option value="2022C">2022 Problem C: 社交网络影响力传播</option>
                <option value="2020A">2020 Problem A: 高中生暑期工作选择</option>
            </select>

            <div class="problem-preview" id="problemPreview"></div>
        </div>

        <!-- Step 2: 生成论文 -->
        <div class="step-card">
            <div class="step-header">
                <div class="step-number">2</div>
                <div class="step-title">生成论文</div>
            </div>

            <button class="btn-primary" id="generateBtn" disabled>
                🚀 开始生成论文
            </button>

            <div class="status-box" id="statusBox">
                <div id="genlogMount"></div>
            </div>
        </div>

        <!-- Step 3: 查看结果 -->
        <div class="result-box" id="resultBox">
            <h3 style="margin-top: 0;">✅ 论文生成完成！</h3>

            <div class="result-stats">
                <div class="stat-item">
                    <div class="stat-value" id="statSections">-</div>
                    <div class="stat-label">章节数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statPapers">-</div>
                    <div class="stat-label">引用文献</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statChunks">-</div>
                    <div class="stat-label">知识片段</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statWords">-</div>
                    <div class="stat-label">字数</div>
                </div>
            </div>

            <div class="result-actions">
                <button class="btn-primary" id="downloadDocx">📄 下载 Word 文档</button>
                <button class="btn-secondary" id="viewMarkdown">📝 查看 Markdown</button>
                <button class="btn-secondary" id="resetBtn">🔄 生成新论文</button>
            </div>
        </div>
    </div>

    <script src="/static/progress-log.js"></script>
    <script>
        // 题目数据
        const PROBLEMS = {
            '2023A': {
                problem_id: '2023A',
                title: '2023 Problem A: 应急救护车选址优化',
                description: `在城市中为应急救护车选择最优站点位置。需要考虑：
• 覆盖所有区域
• 响应时间最小化
• 站点数量和成本
• 交通拥堵情况

目标：建立数学模型，优化站点布局，确保8分钟内到达任意地点。`,
                query: 'emergency ambulance facility location optimization queueing theory'
            },
            '2022C': {
                problem_id: '2022C',
                title: '2022 Problem C: 社交网络影响力传播',
                description: `研究社交网络中信息传播的动力学模型。需要考虑：
• 网络拓扑结构
• 用户影响力差异
• 信息传播速度
• 关键节点识别

目标：建立传播模型，识别最具影响力的用户节点。`,
                query: 'social network influence propagation graph theory dynamics'
            },
            '2020A': {
                problem_id: '2020A',
                title: '2020 Problem A: 高中生暑期工作选择',
                description: `为高中生选择最合适的暑期工作。需要考虑：
• 收入、学习、地点、工作时长
• 个人偏好权重
• 约束条件（最低收入、最大时长）
• 多目标决策

目标：建立评分模型，为不同学生推荐最优工作。`,
                query: 'multi-criteria decision making optimization preference aggregation'
            }
        };

        let currentSessionId = null;
        let paperCtl = null;

        // 元素引用
        const problemSelect = document.getElementById('problemSelect');
        const problemPreview = document.getElementById('problemPreview');
        const generateBtn = document.getElementById('generateBtn');
        const statusBox = document.getElementById('statusBox');
        const resultBox = document.getElementById('resultBox');
        const resetBtn = document.getElementById('resetBtn');
        const downloadDocx = document.getElementById('downloadDocx');
        const viewMarkdown = document.getElementById('viewMarkdown');

        // 支持从大纲页跳转而来：?session_id=xxx（复用大纲会话，标题/描述由后端从会话读取）
        const urlParams = new URLSearchParams(window.location.search);
        const fromSessionId = urlParams.get('session_id');

        if (fromSessionId) {
            // 隐藏题目选择与按钮，先查会话状态：已完成 → 展示结果；否则断点续传
            problemSelect.closest('.step-card').style.display = 'none';
            generateBtn.style.display = 'none';
            statusBox.style.display = 'block';
            statusBox.className = 'status-box';
            restoreOrResume(fromSessionId);
        }

        // 刷新/重开：已完成直接展示结果，未完成则断点续传生成
        async function restoreOrResume(sid) {
            try {
                const resp = await fetch('/api/paper/session/' + encodeURIComponent(sid));
                if (!resp.ok) throw new Error('会话不存在');
                const data = await resp.json();
                if (data.has_docx || data.complete) {
                    showResultFromState(sid, data);
                    return;
                }
                await generatePaper({}, sid);
            } catch (error) {
                showError('加载会话失败: ' + error.message);
            }
        }

        // 用后端会话状态填充结果面板（已完成 / 部分完成的论文）
        function showResultFromState(sid, data) {
            currentSessionId = sid;
            const sections = data.sections || [];
            const doneCount = sections.filter(s =>
                s.status === 'approved' || s.status === 'draft'
            ).length;
            const words = sections.reduce((sum, s) => sum + (s.chars || 0), 0);
            paperCtl = GenLog.mount(document.getElementById('genlogMount'), { total: 10, kind: 'paper' });
            paperCtl.finish({ type: 'complete' });
            showResult({ sections: doneCount, papers: '-', chunks: '-', words: words });
        }

        // 选择题目
        problemSelect.addEventListener('change', function() {
            const problemId = this.value;
            if (problemId && PROBLEMS[problemId]) {
                const problem = PROBLEMS[problemId];
                problemPreview.textContent = problem.description;
                problemPreview.style.display = 'block';
                generateBtn.disabled = false;
            } else {
                problemPreview.style.display = 'none';
                generateBtn.disabled = true;
            }
        });

        // 开始生成
        generateBtn.addEventListener('click', async function() {
            const problemId = problemSelect.value;
            if (!problemId) return;

            const problem = PROBLEMS[problemId];

            // 禁用按钮
            generateBtn.disabled = true;
            problemSelect.disabled = true;

            // 显示状态
            statusBox.style.display = 'block';
            statusBox.className = 'status-box';
            resultBox.style.display = 'none';

            try {
                await generatePaper(problem, null);
            } catch (error) {
                showError('生成失败: ' + error.message);
                generateBtn.disabled = false;
                problemSelect.disabled = false;
            }
        });

        // 生成论文流程
        async function generatePaper(problem, sessionId) {
            paperCtl = GenLog.mount(document.getElementById('genlogMount'), { total: 10, kind: 'paper' });
            const response = await fetch('/api/paper/generate-full', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    problem_id: problem.problem_id || '',
                    problem_title: problem.title || '',
                    problem_description: problem.description || '',
                    search_query: problem.query || '',
                    session_id: sessionId || ''
                })
            });

            if (!response.ok) {
                throw new Error('请求失败');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                // stream:true 避免多字节中文被分片截断
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();  // 最后一行可能不完整，留到下次累积

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;

                    const data = JSON.parse(line.substring(6));

                    if (data.type === 'progress' || data.type === 'section_done' || data.type === 'section_error') {
                        paperCtl.push(data);
                    } else if (data.type === 'complete') {
                        currentSessionId = data.session_id;
                        paperCtl.finish(data);
                        handleComplete(data);
                        return;
                    } else if (data.type === 'error') {
                        throw new Error(data.message);
                    }
                }
            }
        }

        function handleComplete(data) {
            // 把 session_id 写进 URL，刷新后据此直接展示结果（不再重跑）
            if (data.session_id) {
                history.replaceState(null, '', '/paper?session_id=' + encodeURIComponent(data.session_id));
            }
            showResult(data.stats);
        }

        function showError(message) {
            const mount = document.getElementById('genlogMount');
            if (mount) {
                (paperCtl || GenLog.mount(mount, { total: 10, kind: 'paper' })).fail(message);
            }
        }

        function showResult(stats) {
            resultBox.style.display = 'block';
            document.getElementById('statSections').textContent = stats.sections;
            document.getElementById('statPapers').textContent = stats.papers;
            document.getElementById('statChunks').textContent = stats.chunks;
            document.getElementById('statWords').textContent = stats.words.toLocaleString();

            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 下载 Word
        downloadDocx.addEventListener('click', function() {
            if (!currentSessionId) return;
            window.location.href = `/api/paper/download/${currentSessionId}.docx`;
        });

        // 查看 Markdown
        viewMarkdown.addEventListener('click', function() {
            if (!currentSessionId) return;
            window.open(`/api/paper/view/${currentSessionId}`, '_blank');
        });

        // 重置
        resetBtn.addEventListener('click', function() {
            location.reload();
        });

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
