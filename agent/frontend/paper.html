<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/static/chat-tasks.js?v=1"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文生成</title>
    <link rel="stylesheet" href="/static/style.css?v=research3">
    <style>
        .paper-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
            font-family: "Noto Serif SC", serif;
            font-weight: 700;
            font-size: 30px;
            color: var(--ink);
        }

        .step-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .step-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .step-number {
            width: 32px;
            height: 32px;
            background: var(--rouge);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 12px;
            font-family: "Noto Serif SC", serif;
            box-shadow: 0 2px 0 var(--rouge-deep);
        }

        .step-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--ink);
            font-family: "Noto Serif SC", serif;
        }

        .problem-select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: var(--ink);
            background: #fff;
            margin-bottom: 12px;
            transition: border-color 0.15s;
        }

        .problem-select:focus {
            outline: none;
            border-color: var(--rouge);
        }

        .problem-preview {
            background: var(--mist);
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-soft);
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .btn-primary {
            background: var(--rouge);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 2px 0 var(--rouge-deep);
            transition: all 0.15s;
        }

        .btn-primary:hover {
            background: var(--rouge-deep);
        }

        .btn-primary:disabled {
            background: var(--mist-deep);
            color: var(--ink-soft);
            box-shadow: none;
            cursor: not-allowed;
        }

        .status-box {
            background: var(--paper);
            border: 1px solid var(--line);
            padding: 14px 16px;
            margin-top: 16px;
            border-radius: 8px;
            display: none;
        }

        .result-box {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 20px var(--shadow);
            display: none;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 16px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--rouge);
        }

        .stat-label {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 4px;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--line);
            padding: 10px 20px;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-secondary:hover {
            border-color: var(--rouge);
            color: var(--rouge);
        }
    </style>

<body>
    <div class="paper-container">
        <nav class="flow-actions"><a id="paper-back-outline" href="/outline?history=1">返回大纲</a><a id="paper-back-solve" href="/solve">返回建模</a></nav>
        <h1 class="page-title" id="paper-title">我的论文</h1>
        <div id="paper-source" class="flow-source" hidden></div>

        <!-- Step 1: 选择题目 -->
        <div class="step-card">
            <div class="step-header">
                <div class="step-number">1</div>
                <div class="step-title">选择建模问题</div>
            </div>

            <select class="problem-select" id="problemSelect">
                <option value="">-- 请选择一个问题 --</option>
                <option value="2023A">2023 Problem A: 应急救护车选址优化</option>
                <option value="2022C">2022 Problem C: 社交网络影响力传播</option>
                <option value="2020A">2020 Problem A: 高中生暑期工作选择</option>
            </select>

            <div class="problem-preview" id="problemPreview"></div>
        </div>

        <!-- Step 2: 生成论文 -->
        <div class="step-card">
            <div class="step-header">
                <div class="step-number">2</div>
                <div class="step-title">生成论文</div>
            </div>

            <button class="btn-primary" id="generateBtn" disabled>
                🚀 开始生成论文
            </button>

            <div class="status-box" id="statusBox">
                <div id="genlogMount"></div>
            </div>
        </div>

        <!-- Step 3: 查看结果 -->
        <div class="result-box" id="resultBox">
            <h3 id="paper-result-heading" style="margin-top: 0;">论文生成完成</h3>
            <div id="paper-preview" class="flow-paper-preview panel-md"></div>

            <div class="result-stats">
                <div class="stat-item">
                    <div class="stat-value" id="statSections">-</div>
                    <div class="stat-label">章节数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statPapers">-</div>
                    <div class="stat-label">引用文献</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statChunks">-</div>
                    <div class="stat-label">知识片段</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statWords">-</div>
                    <div class="stat-label">字数</div>
                </div>
            </div>

            <div class="result-actions">
                <button class="btn-primary" id="downloadDocx">📄 下载 Word 文档</button>
                <button class="btn-secondary" id="viewMarkdown">📝 查看 Markdown</button>
                <button class="btn-secondary" id="resetBtn">编辑大纲</button>
                <button class="btn-secondary" id="retryPaper" hidden>继续生成未完成章节</button>
            </div>
            <p class="format-audit" id="formatAudit" role="status" hidden></p>
        </div>
    </div>

    <script src="/static/keysetup.js?v=research3"></script>
  <script src="/static/progress-log.js?v=research3"></script>
    <script>
        const paperShell=document.querySelector('.paper-container'),paperHeader=document.createElement('header');paperHeader.className='paper-header';paperHeader.append(document.getElementById('paper-title'));paperShell.before(paperHeader);const sourceDetails=document.createElement('details');sourceDetails.className='paper-source-details';sourceDetails.innerHTML='<summary>研究来源</summary>';sourceDetails.append(document.getElementById('paper-source'));paperHeader.append(sourceDetails);const oldLinks=paperShell.querySelector('nav.flow-actions');paperHeader.append(oldLinks);
        // Persistent document actions and one reading scroll region.
        const previewNode=document.getElementById('paper-preview'),reading=document.createElement('div');reading.className='paper-reading';
        const tocNode=document.createElement('nav');tocNode.className='paper-toc';tocNode.id='paper-toc';tocNode.setAttribute('aria-label','正文章节');previewNode.before(reading);reading.append(tocNode,previewNode);
        const resultNode=document.getElementById('resultBox');paperShell.before(document.querySelector('.result-actions'));paperHeader.append(document.getElementById('paper-result-heading'));document.getElementById('downloadDocx').disabled=true;
        const more=document.createElement('details');more.className='ui-menu';more.innerHTML='<summary>更多</summary><div class="ui-menu-items"></div>';document.querySelector('.result-actions').append(more);more.querySelector('div').append(document.getElementById('viewMarkdown'),document.getElementById('paper-back-outline'),document.getElementById('paper-back-solve'));oldLinks.remove();
        // 题目数据
        const PROBLEMS = {
            '2023A': {
                problem_id: '2023A',
                title: '2023 Problem A: 应急救护车选址优化',
                description: `在城市中为应急救护车选择最优站点位置。需要考虑：
• 覆盖所有区域
• 响应时间最小化
• 站点数量和成本
• 交通拥堵情况

目标：建立数学模型，优化站点布局，确保8分钟内到达任意地点。`,
                query: 'emergency ambulance facility location optimization queueing theory'
            },
            '2022C': {
                problem_id: '2022C',
                title: '2022 Problem C: 社交网络影响力传播',
                description: `研究社交网络中信息传播的动力学模型。需要考虑：
• 网络拓扑结构
• 用户影响力差异
• 信息传播速度
• 关键节点识别

目标：建立传播模型，识别最具影响力的用户节点。`,
                query: 'social network influence propagation graph theory dynamics'
            },
            '2020A': {
                problem_id: '2020A',
                title: '2020 Problem A: 高中生暑期工作选择',
                description: `为高中生选择最合适的暑期工作。需要考虑：
• 收入、学习、地点、工作时长
• 个人偏好权重
• 约束条件（最低收入、最大时长）
• 多目标决策

目标：建立评分模型，为不同学生推荐最优工作。`,
                query: 'multi-criteria decision making optimization preference aggregation'
            }
        };

        let currentSessionId = null;
        let paperCtl = null;

        // 元素引用
        const problemSelect = document.getElementById('problemSelect');
        const problemPreview = document.getElementById('problemPreview');
        const generateBtn = document.getElementById('generateBtn');
        const statusBox = document.getElementById('statusBox');
        const resultBox = document.getElementById('resultBox');
        const resetBtn = document.getElementById('resetBtn');
        const downloadDocx = document.getElementById('downloadDocx');
        const viewMarkdown = document.getElementById('viewMarkdown');

        // 支持从大纲页跳转而来：?session_id=xxx（复用大纲会话，标题/描述由后端从会话读取）
        const urlParams = new URLSearchParams(window.location.search);
        const fromSessionId = urlParams.get('session_id');

        if (!fromSessionId)location.replace('/outline?history=1');
        if (fromSessionId) {
            // 隐藏题目选择与按钮，先查会话状态：已完成 → 展示结果；否则断点续传
            problemSelect.closest('.step-card').style.display = 'none';
            generateBtn.style.display = 'none';
            statusBox.style.display = 'block';
            statusBox.className = 'status-box';
            restoreOrResume(fromSessionId);
        }

        // 刷新/重开：已完成直接展示结果，未完成则断点续传生成
        async function restoreOrResume(sid) {
            try {
                const resp = await fetch('/api/paper/session/' + encodeURIComponent(sid));
                if (!resp.ok) throw new Error('会话不存在');
                const data = await resp.json();
                currentSessionId=sid;
                document.getElementById('paper-title').textContent=data.session.topic || '我的论文';
                document.getElementById('paper-back-outline').href='/outline?session_id='+encodeURIComponent(sid);
                if(data.session.source_solve_id){
                    document.getElementById('paper-back-solve').href='/solve?session_id='+encodeURIComponent(data.session.source_solve_id);
                    const source=document.getElementById('paper-source');source.hidden=false;source.textContent='研究材料版本 '+data.session.source_revision+' · 依据学生已确认的研究成果写作';
                }
                if (data.document_state==='partial' || data.complete || data.sections.some(s=>s.status==='approved'&&s.content_md)) {
                    showResultFromState(sid, data);downloadDocx.disabled=!data.has_docx;
                    return;
                }
                generateBtn.style.display=''; generateBtn.disabled=false;generateBtn.textContent='根据已确认大纲生成论文';
                generateBtn.onclick=async()=>{generateBtn.disabled=true;try{await generatePaper({},sid);}catch(e){showError(e.message);}finally{generateBtn.disabled=false;}};
                statusBox.style.display='none';
            } catch (error) {
                showError('加载会话失败: ' + error.message);
            }
        }

        // 用后端会话状态填充结果面板（已完成 / 部分完成的论文）
        function showResultFromState(sid, data) {
            currentSessionId = sid;
            const sections = data.sections || [];
            const doneCount = sections.filter(s =>
                s.status === 'approved' || s.status === 'draft'
            ).length;
            const words = sections.reduce((sum, s) => sum + (s.chars || 0), 0);
            paperCtl = GenLog.mount(document.getElementById('genlogMount'), { total: 10, kind: 'paper' });
            if(data.complete)paperCtl.finish({ type: 'complete' });
            else paperCtl.fail('部分章节尚未生成，可继续生成。');
            showResult({ sections: doneCount, papers: '-', chunks: '-', words: words }, !data.complete);
        }

        // 选择题目
        problemSelect.addEventListener('change', function() {
            const problemId = this.value;
            if (problemId && PROBLEMS[problemId]) {
                const problem = PROBLEMS[problemId];
                problemPreview.textContent = problem.description;
                problemPreview.style.display = 'block';
                generateBtn.disabled = false;
            } else {
                problemPreview.style.display = 'none';
                generateBtn.disabled = true;
            }
        });

        // 开始生成
        generateBtn.addEventListener('click', async function() {
            const problemId = problemSelect.value;
            if (!problemId) return;

            const problem = PROBLEMS[problemId];

            // 禁用按钮
            generateBtn.disabled = true;
            problemSelect.disabled = true;

            // 显示状态
            statusBox.style.display = 'block';
            statusBox.className = 'status-box';
            resultBox.style.display = 'none';

            try {
                await generatePaper(problem, null);
            } catch (error) {
                showError('生成失败: ' + error.message);
                generateBtn.disabled = false;
                problemSelect.disabled = false;
            }
        });

        // 生成论文流程
        async function generatePaper(problem, sessionId) {
            statusBox.style.display='block';
            if(!await ResearchUI.needModel())return;
            window.ResearchCompanion?.notify('start',{id:'paper',state:'thinking',label:'生成论文章节'});
            generateBtn.disabled=true;
            const savedLog=document.getElementById('paper-generation-history');
            if(savedLog){savedLog.open=true;resultBox.before(savedLog);}
            paperCtl = GenLog.mount(document.getElementById('genlogMount'), { total: 10, kind: 'paper' });
            const response = await fetch('/api/paper/generate-full', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    problem_id: problem.problem_id || '',
                    problem_title: problem.title || '',
                    problem_description: problem.description || '',
                    search_query: problem.query || '',
                    session_id: sessionId || ''
                })
            });

            if (!response.ok) {
                throw new Error('请求失败');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                // stream:true 避免多字节中文被分片截断
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();  // 最后一行可能不完整，留到下次累积

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;

                    const data = JSON.parse(line.substring(6));

                    if (data.type === 'progress' || data.type === 'section_done' || data.type === 'section_error') {
                        if(data.session_id){currentSessionId=data.session_id;history.replaceState(null,'','/paper?session_id='+encodeURIComponent(currentSessionId));}
                        paperCtl.push(data);
                        if(data.type==='section_done'&&currentSessionId)refreshPaperBody();
                    } else if (data.type === 'complete' || data.type === 'partial') {
                        currentSessionId = data.session_id;
                        if(data.type==='complete')paperCtl.finish(data);else paperCtl.fail('部分章节生成失败，已完成内容已保存。');
                        handleComplete(data);
                        return;
                    } else if (data.type === 'error') {
                        throw new Error(data.message);
                    }
                }
            }
            throw new Error('连接已结束，生成尚未完成。可继续生成未完成章节。');
        }

        function handleComplete(data) {
            // 把 session_id 写进 URL，刷新后据此直接展示结果（不再重跑）
            if (data.session_id) {
                history.replaceState(null, '', '/paper?session_id=' + encodeURIComponent(data.session_id));
            }
            showResult(data.stats, data.type==='partial');
        }

        function showError(message) {
            window.ResearchCompanion?.notify('finish',{id:'paper'});
            window.ResearchCompanion?.notify('result',{state:'offline',alpha:'论文生成尚未完成，已完成的章节仍会保留。',xiaobei:'查看错误提示后，可以继续生成剩余章节。'});
            const mount = document.getElementById('genlogMount');
            if (mount) {
                (paperCtl || GenLog.mount(mount, { total: 10, kind: 'paper' })).fail(message);
            }
            if(currentSessionId)document.getElementById('retryPaper').hidden=false;
            resultBox.style.display='block';
            document.getElementById('paper-result-heading').textContent='生成尚未完成';
            refreshPaperBody();
            generateBtn.disabled=false;
        }

        async function refreshPaperBody(){
            if(!currentSessionId)return;
            const preview=document.getElementById('paper-preview');
            try{const r=await fetch('/api/paper/assemble/'+encodeURIComponent(currentSessionId));if(!r.ok)throw Error();const d=await r.json();MMRender.renderMarkdown(preview,d.markdown||d.content_md||'');
                const headings=[...preview.querySelectorAll('h1,h2')];const toc=document.getElementById('paper-toc');toc.innerHTML='';headings.forEach((h,i)=>{h.id='paper-section-'+i;const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;toc.append(a);});
            }catch{preview.textContent='正文暂时无法加载。请刷新重试，已保存内容仍会保留。';}
        }
        function showResult(stats, partial=false) {
            window.ResearchCompanion?.notify('finish',{id:'paper'});
            window.ResearchCompanion?.notify('result',{state:partial?'draft_ready':'complete',alpha:partial?'部分章节已经保存，论文尚未全部生成。':'论文生成完成，请核对研究依据和引用。',xiaobei:partial?'可以继续生成未完成的章节。':'提交前，再检查数据来源和结论的适用范围。'});
            resultBox.style.display = 'block';
            document.getElementById('paper-result-heading').textContent=partial?'部分完成 · 已保存当前草稿':'论文生成完成';
            document.getElementById('retryPaper').hidden=!partial;
            downloadDocx.textContent=partial?'下载当前草稿 Word':'下载 Word 文档';
            downloadDocx.disabled=false;
            generateBtn.style.display='none';
            let history=document.getElementById('paper-generation-history');
            if(!history){
                history=document.createElement('details');history.id='paper-generation-history';
                const summary=document.createElement('summary');summary.textContent='查看生成记录';history.append(summary,statusBox.closest('.step-card'));
            }
            history.open=false;resultBox.after(history);
            refreshPaperBody();
            document.getElementById('statSections').textContent = stats.sections;
            document.getElementById('statPapers').textContent = stats.papers;
            document.getElementById('statChunks').textContent = stats.chunks;
            document.getElementById('statWords').textContent = stats.words.toLocaleString();
            // 导出时的自动排版复查：公式有没有残留 LaTeX，用户不用管，这里只如实汇报。
            const audit = document.getElementById('formatAudit');
            if (audit) {
                const f = stats.format;
                if (!f) { audit.hidden = true; }
                else if (f.ok) {
                    audit.hidden = false;
                    audit.className = 'format-audit ok';
                    audit.textContent = `排版复查通过：${f.math_objects} 个公式已转成 Word 公式`
                        + (f.preflight_fixes?.length ? `（导出前修整：${f.preflight_fixes.join('；')}）` : '');
                } else {
                    audit.hidden = false;
                    audit.className = 'format-audit warn';
                    audit.textContent = `排版复查：${f.leftovers} 处公式没能转成 Word 公式，已降级为可读文本`
                        + (f.samples?.length ? `（例如 ${f.samples.join('、')}）` : '')
                        + '。建议在 Word 里核对这几处。';
                }
            }

            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 下载 Word
        downloadDocx.addEventListener('click', function() {
            if (!currentSessionId) return;
            window.location.href = `/api/paper/download/${currentSessionId}.docx`;
        });

        // 查看 Markdown
        viewMarkdown.addEventListener('click', function() {
            if (!currentSessionId) return;
            window.open(`/api/paper/view/${currentSessionId}`, '_blank');
        });

        // 重置
        resetBtn.addEventListener('click', function() {
            location.href=currentSessionId?'/outline?session_id='+encodeURIComponent(currentSessionId):'/solve';
        });
        document.getElementById('retryPaper').onclick=async function(){this.disabled=true;try{await generatePaper({},currentSessionId);}catch(e){showError(e.message);}finally{this.disabled=false;}};
        const statsEl=document.querySelector('.result-stats'),statsDetails=document.createElement('details');
        const statsSummary=document.createElement('summary');statsSummary.textContent='文档统计';statsDetails.append(statsSummary,statsEl);resultBox.append(statsDetails);

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
